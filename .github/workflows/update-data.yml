name: Update Soberanos Data

on:
  # Día 5 de cada mes a las 10:00 UTC
  schedule:
    - cron: "0 10 5 * *"
  # Disparo manual desde GitHub → Actions → "Run workflow"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pdfplumber requests beautifulsoup4

      - name: Run update script
        run: python scripts/fetch_mef_data.py

      - name: Show what changed
        run: |
          echo "=== data/latest.json (primeras 30 líneas) ==="
          head -30 data/latest.json || true
          echo ""
          echo "=== Git diff ==="
          git diff --stat

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if git diff --staged --quiet; then
            echo "Sin cambios — datos ya están actualizados."
          else
            PERIOD=$(python -c "
import json
with open('data/latest.json') as f:
    d = json.load(f)
print(d['meta']['periodo'])
")
            git commit -m "data: actualiza tenencias ${PERIOD} [skip ci]"
            git push
            echo "✓ Push realizado para período: ${PERIOD}"
          fi
