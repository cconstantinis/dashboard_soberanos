name: Update AFPs (SBS semanal)
on:
  schedule:
    # La SBS publica el boletín semanal los viernes (corte del viernes anterior).
    # Sábado y martes 14:00 UTC (09:00 Lima); si no hay XLS nuevo, no hace nada.
    - cron: "0 14 * * 2,6"
  workflow_dispatch:
    inputs:
      desde:
        description: "Re-descargar desde AAAA-MM (mes de publicación, ej. 2026-01). Vacío = solo semanas nuevas"
        required: false
        default: ""
concurrency:
  group: data-push
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Descargar y parsear XLS de la SBS
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.desde }}" != "" ]; then ARGS="--desde ${{ github.event.inputs.desde }}"; fi
          python scripts/fetch_sbs_afp.py $ARGS
      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/afp/
          if git diff --staged --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "data: actualiza AFPs SBS semanal [skip ci]"
          git pull --rebase origin main && git push
